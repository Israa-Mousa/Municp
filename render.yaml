databases:
  - name: municp-staging-db
    databaseName: municp_staging
    user: municp_staging
    plan: free
    region: frankfurt

services:
  - type: web
    name: municp-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: staging
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: municp-staging-db
          property: connectionString
      - key: FILESYSTEM_DISK
        value: public
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
      - key: SESSION_SECURE_COOKIE
        value: "true"
